name: CI/CD Pipeline - IAS

on:
  pull_request:
    branches: [ "develop", "main" ]
  push:
    branches: [ "develop", "main", "**" ]

permissions:
  contents: write
  pull-requests: write

jobs:
  # ==========================================
  # ETAPA 1: CONTINUOUS INTEGRATION (CI)
  # ==========================================

  # NUEVO: Abre PR automático si pusheas a una rama que no sea develop o main
  auto-create-pr:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/main'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create Pull Request to Develop
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Verifica si ya existe un PR abierto para esta rama antes de intentar crear uno nuevo
        PR_EXISTS=$(gh pr list --head "${{ github.ref_name }}" --base "develop" --json number --jq '.[0].number')
        
        if [ -z "$PR_EXISTS" ]; then
          gh pr create \
            --title "Automated PR: ${{ github.ref_name }} -> develop" \
            --body "PR generado automáticamente al recibir un commit en la rama **${{ github.ref_name }}**." \
            --base "develop" \
            --head "${{ github.ref_name }}"
        else
          echo "Ya existe un Pull Request activo (#$PR_EXISTS) para esta rama."
        fi


  backend-unit-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'))

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install bandit pip-audit

    - name: Run Bandit Security Scan
      run: |
        bandit -r app/

    - name: Run Advanced Security Tests (pip-audit)
      if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
      run: |
        pip-audit

    - name: Run Unit Tests
      env:
        PYTHONPATH: .
      run: |
        pytest tests/unit/test_main.py

  backend-integration-tests:
    runs-on: ubuntu-latest
    needs: backend-unit-tests
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'))

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run Integration Tests
      env:
        PYTHONPATH: .
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: |
        pytest tests/integration/test_integration.py

  # ==========================================
  # ETAPA 2: CONTINUOUS DEPLOYMENT (CD)
  # ==========================================
  
  # 1. DEPLOY AUTOMÁTICO A DEV (Tras mergear en develop)
  deploy-to-dev:
    runs-on: ubuntu-latest
    needs: backend-integration-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    
    steps:
    - name: Trigger Render Deploy to DEV
      run: |
        curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_DEV }}"

  # 2. DEPLOY AUTOMÁTICO A QA (Tras mergear en main)
  deploy-to-qa:
    runs-on: ubuntu-latest
    needs: backend-integration-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Trigger Render Deploy to QA
      run: |
        curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_QA }}"

  # 3. DEPLOY MANUAL A PRD (Requiere tu aprobación expresa en la interfaz)
  deploy-to-prd:
    runs-on: ubuntu-latest
    needs: backend-integration-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Vinculamos este job al entorno protegido de GitHub
    environment:
      name: production
    
    steps:
    - name: Trigger Render Deploy to PRD
      run: |
        curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_PRD }}"