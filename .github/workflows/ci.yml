name: CI/CD Pipeline - IAS

on:
  pull_request:
    branches: [ "develop", "main" ]
  push:
    branches: [ "develop", "main", "**" ]

permissions:
  contents: write
  pull-requests: write

jobs:
  # ==========================================
  # ETAPA 1: CONTINUOUS INTEGRATION (CI)
  # ==========================================
  
  create-pr:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4.2.2

    - name: Create Pull Request (Feature -> Develop o Develop -> Main)
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Definimos variables dinámicas según la rama que recibe el push
        if [ "${{ github.ref_name }}" = "develop" ]; then
          TARGET_BASE="main"
          PR_TITLE="Automated Release: develop -> main"
          PR_BODY="PR generado automáticamente al consolidar cambios en la rama **develop**. Listo para pruebas y despliegue a QA/PRD."
        elif [ "${{ github.ref_name }}" != "main" ]; then
          TARGET_BASE="develop"
          PR_TITLE="Automated PR: ${{ github.ref_name }} -> develop"
          PR_BODY="PR generado automáticamente al recibir un commit en la rama **${{ github.ref_name }}**."
        else
          echo "Push directo en main. No se requiere automatización de PR."
          exit 0
        fi

        # Comprueba si ya existe un PR abierto con esta combinación exacta de ramas
        PR_EXISTS=$(gh pr list --head "${{ github.ref_name }}" --base "$TARGET_BASE" --state open --json number --jq '.[0].number')
        
        if [ -z "$PR_EXISTS" ] || [ "$PR_EXISTS" = "null" ]; then
          gh pr create \
            --title "$PR_TITLE" \
            --body "$PR_BODY" \
            --base "$TARGET_BASE" \
            --head "${{ github.ref_name }}"
          echo "Pull Request creado exitosamente hacia $TARGET_BASE."
        else
          echo "Ya existe un Pull Request activo (#$PR_EXISTS) de ${{ github.ref_name }} hacia $TARGET_BASE."
        fi

  backend-unit-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'))

    steps:
    - name: Checkout code
      uses: actions/checkout@v4.2.2

    - name: Set up Python
      uses: actions/setup-python@v5.4.0
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install bandit pip-audit

    - name: Run Bandit Security Scan
      run: |
        bandit -r app/

    - name: Run Advanced Security Tests (pip-audit)
      if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
      run: |
        pip-audit

    - name: Run Unit Tests
      env:
        PYTHONPATH: .
      run: |
        pytest tests/unit/test_main.py

  backend-integration-tests:
    runs-on: ubuntu-latest
    needs: backend-unit-tests
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'))

    steps:
    - name: Checkout code
      uses: actions/checkout@v4.2.2

    - name: Set up Python
      uses: actions/setup-python@v5.4.0
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run Integration Tests
      env:
        PYTHONPATH: .
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: |
        pytest tests/integration/test_integration.py

  # ==========================================
  # ETAPA 2: CONTINUOUS DEPLOYMENT (CD)
  # ==========================================
  
  deploy-to-dev:
    runs-on: ubuntu-latest
    needs: backend-integration-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    
    steps:
    - name: Trigger Render Deploy to DEV
      run: |
        curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_DEV }}"

  # 2. DEPLOY AUTOMÁTICO A QA
  deploy-to-qa:
    runs-on: ubuntu-latest
    needs: backend-integration-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Trigger Render Deploy to QA
      run: |
        curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_QA }}"

  # 3. DEPLOY MANUAL A PRD
  deploy-to-prd:
    runs-on: ubuntu-latest
    needs: backend-integration-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
    
    steps:
    - name: Trigger Render Deploy to PRD
      run: |
        curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_PRD }}"
