name: CI Pipeline - IAS

# El pipeline se activa automáticamente al abrir o actualizar un PR hacia develop o main
on:
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
    # 1. Copia el código de tu repositorio dentro de la máquina virtual de GitHub
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Configura el entorno de Python (usamos la misma versión 3.12 que tenés local)
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-node-version: '3.12'

    # 3. Instala las dependencias del proyecto y de desarrollo (simulando tu venv)
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    # 4. PASO CLAVE: Ejecuta los tests unitarios
    # Seteamos el PYTHONPATH en Linux para que encuentre la carpeta 'app' sin romperse
    - name: Run Unit Tests
      env:
        PYTHONPATH: .
      run: |
        pytest tests/unit/test_main.py