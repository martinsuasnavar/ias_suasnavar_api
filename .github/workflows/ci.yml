name: CI/CD Pipeline - IAS

on:
  push:
    branches: [ "develop", "main", "feature/*" ] # Escucha los pushes en features y los merges en dev/main
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  # ==========================================
  # ETAPA 1: VALIDACIÓN E INTEGRACIÓN (CI)
  # ==========================================
  backend-tests:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install bandit pip-audit

    - name: Run Bandit Security Scan
      run: |
        bandit -r app/

    - name: Run Advanced Security Tests (pip-audit)
      if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
      run: |
        pip-audit

    - name: Run Unit & Integration Tests
      run: |
        pytest

  # ==========================================
  # ETAPA 2: AUTOMATIZACIÓN DE PULL REQUESTS
  # ==========================================
  
  # A. Crea el PR de feature a develop automáticamente al pushear la feature
  auto-pr-feature-to-dev:
    runs-on: ubuntu-latest
    needs: backend-tests
    if: startsWith(github.ref, 'refs/heads/feature/') && github.event_name == 'push'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create Pull Request to Develop
      uses: peter-evans/create-pull-request@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        branch: ${{ github.ref_name }}
        base: develop
        title: "auto(r): Merge ${{ github.ref_name }} into develop"
        body: "Pull Request generado automáticamente por el pipeline de CI tras validación exitosa."

  # B. Crea el PR de develop a main automáticamente cuando se modifica develop
  auto-pr-dev-to-main:
    runs-on: ubuntu-latest
    needs: backend-tests
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create Pull Request to Main
      uses: peter-evans/create-pull-request@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        branch: develop
        base: main
        title: "auto(release): Sync develop with main"
        body: "PR automático generado porque la rama develop sufrió modificaciones (Merge de Feature)."

  # ==========================================
  # ETAPA 3: CONTINUOUS DEPLOYMENT (CD)
  # ==========================================
  deploy-to-dev:
    runs-on: ubuntu-latest
    needs: backend-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    steps:
    - name: Trigger Render Deploy to DEV
      run: |
        curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_DEV }}"

  deploy-to-qa:
    runs-on: ubuntu-latest
    needs: backend-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - name: Trigger Render Deploy to QA
      run: |
        curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_QA }}"